name: simple-notes

# 3 容器：db（可替换为外部库）+ app（Spring Boot）+ web（nginx）
# 首次使用：bash scripts/init-env.sh
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simple_notes}
      POSTGRES_USER: ${POSTGRES_USER:-simple_notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 bash scripts/init-env.sh}
    volumes:
      - simple-notes-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-0.0.0-dev}
    image: simple-notes-app:local
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?请先运行 bash scripts/init-env.sh}
      ROOT_INITIAL_PASSWORD: ${ROOT_INITIAL_PASSWORD:-}
      # 外部数据库：在 .env 设置 DB_URL / DB_USERNAME / DB_PASSWORD
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/simple_notes}
      DB_USERNAME: ${DB_USERNAME:-simple_notes}
      DB_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      MEDIA_LOCAL_ROOT: /data/media
      LOG_FILE: /data/logs/simple-notes.log
      STORAGE_MODE: ${STORAGE_MODE:-LOCAL}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      STORAGE_URL_MODE: ${STORAGE_URL_MODE:-DIRECT}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - ./data/media:/data/media
      - ./data/logs:/data/logs
    # 默认只绑定回环：给同机裸机 nginx 用；远程 nginx 时改为 APP_BIND=0.0.0.0
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8081}:8081"
    # 外部数据库在宿主机时可用 host.docker.internal:5432
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/version >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-0.0.0-dev}
    image: simple-notes-web:local
    ports:
      - "${SIMPLE_NOTES_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  simple-notes-pg:
