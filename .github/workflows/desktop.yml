name: desktop

# 打 v* tag 时构建 Windows 桌面便携包，并上传到 GitHub Release。
# 目前只做 Windows：macOS / Linux 尚未实机验收，待验收后再加对应 runner。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Install Wails v3.1.0
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          $gopath = go env GOPATH
          "$gopath/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build desktop (Windows amd64)
        shell: pwsh
        run: |
          $env:RELEASE_VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          $env:RELEASE_COMMIT = (git rev-parse --short HEAD)
          $env:RELEASE_BUILD_TIME = (git log -1 --format=%cI)
          node scripts/build-desktop.mjs

      - name: Package release asset
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "dist/SimpleNotes-$version-windows-amd64.exe"
          Copy-Item desktop/bin/SimpleNotes.exe $exe
          Compress-Archive -Path $exe -DestinationPath "dist/SimpleNotes-$version-windows-amd64.zip"
          $lines = @()
          foreach ($file in @($exe, "dist/SimpleNotes-$version-windows-amd64.zip")) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content "dist/SHA256SUMS.txt"
          Get-ChildItem dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
