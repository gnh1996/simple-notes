name: images

# 打 tag（v0.2.0）时构建并推送 app / web 镜像到 GHCR：
#   ghcr.io/<owner>/simple-notes-app:<version>  + :latest
#   ghcr.io/<owner>/simple-notes-web:<version>  + :latest
#
# 只构建 linux/amd64。需要 arm64 时在 docker/build-push-action 上加 `platforms`
# 并先 setup-qemu；注意 Java / Maven 构建会跑在模拟层上，耗时显著增加，
# 更实际的做法是给 arm64 单独用原生 runner（如 ubuntu-24.04-arm）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本（手动触发时使用；留空则取当前 ref 并去掉 v 前缀）"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [app, web]
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本与镜像命名空间
        id: meta-input
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.meta-input.outputs.owner }}/simple-notes-${{ matrix.target }}
          tags: |
            type=raw,value=${{ steps.meta-input.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ steps.meta-input.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
