user  nginx;
worker_processes  auto;
pid /run/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # 登录接口在 nginx 层限流：应用侧 clientIp() 只信 remoteAddr，反代后 IP 维度会退化为 127.0.0.1
    limit_req_zone $binary_remote_addr zone=login_rl:10m rate=10r/m;
    limit_req_status 429;

    upstream app {
        server app:8081;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 25m;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # ---- 管理端静态（同源 /admin/） ----
        location = /admin {
            return 301 /admin/;
        }

        location /admin/assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
        }

        location /admin/ {
            try_files $uri $uri/ /admin/index.html;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }

        # ---- 登录限流（精确匹配优先于 /api/） ----
        location = /api/auth/login {
            limit_req zone=login_rl burst=20 nodelay;
            include /etc/nginx/proxy-app.conf;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ---- API：SSE / 大文件上传 / 媒体流式下载 ----
        location /api/ {
            include /etc/nginx/proxy-app.conf;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ---- 博客 runtime（jar 内 static/blog） ----
        location /blog/ {
            include /etc/nginx/proxy-app.conf;
            proxy_buffering on;
        }

        # ---- 博客页壳与 history fallback（后端 BlogPageController） ----
        location / {
            include /etc/nginx/proxy-app.conf;
            proxy_buffering on;
        }
    }
}
