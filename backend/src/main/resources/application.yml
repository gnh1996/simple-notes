spring:
  ai:
    # 关闭全部模型自动装配：AI 模型由 AiThemeService 懒加载手工构建（key 缺失时不影响启动）。
    # starter 自带 chat / image / embedding / audio-speech / audio-transcription / moderation 六组装配，
    # 缺 key 时除 chat 外都会启动失败，故全部显式 none（docs/theme-ai.md §5）。
    model:
      chat: none
      image: none
      embedding: none
      moderation: none
      audio:
        speech: none
        transcription: none
  application:
    name: simple-notes-backend
  config:
    # 本地值来源（不入库，模板见 application-local.yml.example）；缺失时静默跳过，
    # 此时由同名环境变量提供值（部署方式，优先级高于文件）
    import: optional:classpath:application-local.yml
  datasource:
    # 占位符在整个 Environment 中按名解析：命令行参数 > 环境变量 > 配置文件
    # 本地值由 application-local.yml 提供，部署时用同名环境变量（DB_URL / DB_USERNAME / DB_PASSWORD）
    # 注意：配置绑定不会因占位符未解析而失败，而是按字面量传入（详见 application-local.yml.example 注释）
    url: "${DB_URL:jdbc:postgresql://localhost:5432/simple_notes}"
    username: "${DB_USERNAME:simple_notes}"
    password: "${DB_PASSWORD}"
  jpa:
    # 建表只允许走 Flyway（db/migration）；禁止 Hibernate 自动 DDL。
    # 显式固定为 validate：启动时校验实体映射与表结构一致，结构变更必须先有迁移脚本。
    hibernate:
      ddl-auto: validate
  flyway:
    # 迁移脚本唯一来源；关闭 / 改路径都属于变更决策，需同步更新文档
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 附件上传上限；与 StorageProperties.maxBytes 的校验保持一致
      max-file-size: 20MB
      max-request-size: 25MB

logging:
  # 控制台 + 文件双写（默认相对路径 logs/simple-notes.log，可用 LOG_FILE 环境变量覆盖）；
  # 滚动保留：单文件 10MB、保留 30 天、归档总量上限 1GB（归档命名走 Boot 默认 ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz）
  level:
    root: INFO
    cc.naihao.simplenotes: INFO
  file:
    name: "${LOG_FILE:logs/simple-notes.log}"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

simple-notes:
  auth:
    # JWT 签名密钥（HS256，32+ 字节随机值，值来源：本地 application-local.yml / 部署环境变量）。
    # 无默认值：缺失或不满足长度时由 AuthProperties 校验在启动时失败（fail-fast，见 docs/auth-rbac.md §9）
    jwt-secret: "${JWT_SECRET}"
  # 附件存储（docs/attachment-storage.md）：
  # mode 是 site_setting.storage.mode 缺失时的兜底；运行时切换走 /api/admin/media/storage。
  # R2 采用私有 bucket + Nginx auth_request 预签名代理（方案 B），凭据只从外部值源读取。
  storage:
    max-bytes: "${STORAGE_MAX_BYTES:20971520}"
    public-base-url: "${MEDIA_PUBLIC_BASE_URL:}"
    url-mode: "${STORAGE_URL_MODE:DIRECT}"
    mode: "${STORAGE_MODE:LOCAL}"
    internal-token: "${MEDIA_INTERNAL_TOKEN:}"
    local-root: "${MEDIA_LOCAL_ROOT:${java.io.tmpdir}/simple-notes-media}"
    database:
      max-bytes: "${STORAGE_DB_MAX_BYTES:20971520}"
    r2:
      endpoint: "${R2_ENDPOINT}"
      region: "${R2_REGION:auto}"
      bucket: "${R2_BUCKET:simple-notes}"
      access-key: "${R2_ACCESS_KEY_ID}"
      secret-key: "${R2_SECRET_ACCESS_KEY}"
      path-style: "${R2_PATH_STYLE:true}"
      key-prefix: "${R2_KEY_PREFIX:attachments}"
      presign-ttl: "${R2_PRESIGN_TTL:5m}"
      signing: "${R2_SIGNING:auth-request}"
      edge: "${R2_EDGE:nginx}"
      public-base-url: "${R2_PUBLIC_BASE_URL:}"
  # 博客宿主（docs/blog-runtime-theme.md §5.2）：管理端源用于 CSP frame-ancestors 与预览 iframe
  site:
    admin-origin: "${ADMIN_ORIGIN:http://localhost:5173}"
    # runtime 构建产物基址：生产默认 /blog（jar 内 static/blog）；开发期用 BLOG_ASSET_BASE 指向 Vite dev server
    asset-base: "${BLOG_ASSET_BASE:/blog}"
    preview-ttl: 30m
  # 主题 AI 对话（docs/theme-ai.md）：OpenAI-compatible；key 缺失时 AI 接口 400，不影响启动
  ai:
    base-url: "${AI_BASE_URL:}"
    api-key: "${AI_API_KEY:}"
    model: "${AI_MODEL:}"
    timeout: "${AI_TIMEOUT:90s}"
    max-rounds: "${AI_MAX_ROUNDS:2}"
    max-history-turns: "${AI_MAX_HISTORY_TURNS:10}"
